# ~/.config/tmux/tmux.conf  (tmux >= 3.2; tested on 3.4)
# tmux 3.4 loads ~/.tmux.conf AND then this file (verified via #{config_files}),
# so retire the old ~/.tmux.conf symlink or its invalid options will error on start.

# ---------------------------------------------------------------------------
# Terminal & behaviour
# ---------------------------------------------------------------------------
set -g  default-terminal "tmux-256color"       # correct terminfo inside tmux (italics, keys)
set -as terminal-features ",xterm-256color:RGB" # advertise 24-bit colour from the outer terminal
set -as terminal-features ",*-256color:RGB,alacritty*:RGB,xterm-kitty:RGB,foot*:RGB,wezterm:RGB"
set -sg escape-time 10                          # was 500ms default: makes <Esc> in vim instant
set -g  focus-events on                         # lets vim autoread/:checktime on focus
set -g  history-limit 50000
set -g  mouse on                                # scroll, select pane, resize with the mouse
set -g  set-clipboard on                        # OSC 52 copy to the system clipboard (also over ssh)
set -g  renumber-windows on
set -g  display-time 2000
set -g  set-titles on
set -g  set-titles-string "#h: #S:#W"
setw -g mode-keys vi
# default-shell: leave unset; tmux uses $SHELL. Override per host if needed:
# set -g default-shell /bin/bash

# windows and panes start at 1 (key row order)
set -g  base-index 1
setw -g pane-base-index 1

# ---------------------------------------------------------------------------
# Prefix: C-a (as before). C-a a sends a literal C-a (start of line in bash).
# ---------------------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind a send-prefix
bind C-a select-pane -t :.+                     # C-a C-a: cycle panes (unchanged)

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# ---------------------------------------------------------------------------
# Splits / windows open in the current pane's directory
# ---------------------------------------------------------------------------
bind |  split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind -  split-window -v -c "#{pane_current_path}"
bind c  new-window      -c "#{pane_current_path}"

# vi-style pane movement and resizing (-r: repeatable without the prefix)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# layouts / zoom / sync
bind C-i select-layout even-vertical             # note: C-i is the same key as Tab
bind C-v select-layout even-horizontal
bind C-o resize-pane -Z                          # real zoom toggle (was resize-pane -y 1000)
bind C-s setw synchronize-panes \; display "synchronize-panes #{?synchronize-panes,on,off}"

# copy mode (vi keys): v to select, y to yank (goes to clipboard via set-clipboard)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ---------------------------------------------------------------------------
# Status bar (same solarized-ish colours; *-style syntax replaces the
# *-fg/-bg/-attr options that tmux 2.9 removed)
# ---------------------------------------------------------------------------
set -g status on
set -g status-interval 5
set -g status-justify centre
set -g status-style "bg=colour235,fg=yellow"
setw -g monitor-activity on
set -g  visual-activity off                      # highlight the window, no message spam
setw -g window-status-style          "fg=brightblue,bg=colour236"
setw -g window-status-current-style  "fg=brightred,bg=colour236,bold"
setw -g window-status-activity-style "fg=colour235,bg=brightblue"
set -g status-left-length 30
set -g status-right-length 90
# #h is the short hostname built in; load average parsed portably (Linux + macOS)
set -g status-right "#[fg=white]#S #I:#P #[fg=yellow]: %d %b %Y %H:%M : #[fg=green]#h : #[fg=red]#(uptime | sed -E 's/.*load averages?: //; s/,//g')"

# Machine-specific overrides (not in git)
if-shell "test -f ~/.config/tmux/local.conf" "source-file ~/.config/tmux/local.conf"
